name: Scorecard

# OpenSSF Scorecard: sjekker repoet mot god praksis for forsyningskjeden (pinnede actions, tokenrettigheter,
# branch-beskyttelse, review, avhengighetsoppdateringer). Resultatene går til Code scanning.
# Bare for OFFENTLIGE repo (publish_results). Slett filen i private repo.

on:
  schedule:
    - cron: "23 4 * * 1" # mandager 04:23 UTC
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
